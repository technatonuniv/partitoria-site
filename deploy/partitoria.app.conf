# Static VPS origin for the public Partitoria website. The ACME webroot is
# reserved for renewal after public DNS points at this origin.
server {
    listen 80;
    listen [::]:80;
    server_name partitoria.app www.partitoria.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/partitoria-site/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://partitoria.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.partitoria.app;
    ssl_certificate /etc/letsencrypt/live/partitoria.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partitoria.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://partitoria.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name partitoria.app;

    ssl_certificate /etc/letsencrypt/live/partitoria.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partitoria.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/partitoria-site/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HTML must revalidate: it refers to the current release's hashed assets.
    add_header Cache-Control "no-cache" always;

    rewrite ^/ru(?:/(.*))?$ /$1 permanent;
    rewrite ^(.+)/$ $1 permanent;
    # Keep previous releases' immutable assets usable by already-open/cached pages.
    location ^~ /_next/static/ {
        root /var/www/partitoria-site/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ /\. {
        return 404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
