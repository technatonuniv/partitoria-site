# Static origin staging for partitoria.app. HTTPS is added only after a valid
# certificate for both hostnames is installed and verified on the VPS.
server {
    listen 80;
    listen [::]:80;
    server_name partitoria.app www.partitoria.app;

    root /var/www/partitoria-site/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # vinext exports /en as en.html and /en/guide as en/guide.html.
    rewrite ^(.+)/$ $1 permanent;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Only the ACME validation path may expose a leading-dot directory.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
