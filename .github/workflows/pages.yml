name: Verify website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record tested source identity
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_HEAD_SHA"
            printf 'Tested PR merge SHA: %s\nPR head SHA: %s\n' "$TESTED_SHA" "$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Tested source SHA: %s\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: |
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          node --test scripts/test-language.mjs
          npx tsc --noEmit
          npm run lint
          npm run build
          npm run verify

      - name: Verify tracked files unchanged
        run: git diff --exit-code HEAD --
